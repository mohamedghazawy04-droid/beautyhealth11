  <circle cx="256" cy="256" r="160" fill="none" stroke="#34d399" stroke-width="3" opacity="0.35" />
  <g text-anchor="middle" dominant-baseline="central">
    <text x="256" y="240" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="130" font-weight="900" fill="#ffffff" letter-spacing="-3">
      M<tspan fill="#34d399">&amp;</tspan>l
    </text>
    <text x="256" y="325" font-family="'Cairo', sans-serif" font-size="28" font-weight="700" fill="#a7f3d0" letter-spacing="2">
      عناية وأطفال
    </text>
  </g>
</svg>
