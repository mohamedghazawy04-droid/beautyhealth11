  <rect x="565" y="850" width="465" height="660" rx="28" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" />
  <rect x="595" y="880" width="405" height="360" rx="20" fill="#fff1f2" />
  <text x="797" y="1080" font-family="'Cairo', sans-serif" font-size="50" text-anchor="middle">👶</text>
  <text x="965" y="1290" font-family="'Cairo', sans-serif" font-size="30" font-weight="800" fill="#1c1917" text-anchor="end">شامبو أطفال خالي سلفات</text>
  <text x="965" y="1335" font-family="'Cairo', sans-serif" font-size="24" font-weight="600" fill="#a8a29e" text-anchor="end">سانوسان Sanosan Baby</text>
  <text x="595" y="1410" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#be185d">285 جنيه</text>
  <rect x="595" y="1435" width="405" height="55" rx="16" fill="#be185d" />
  <text x="797" y="1472" font-family="'Cairo', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">أضيفي للسلة +</text>

