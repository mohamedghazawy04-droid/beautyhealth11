  <rect x="50" y="1560" width="980" height="260" rx="32" fill="#500724" stroke="#f43f5e" stroke-width="3" />
  <circle cx="160" cy="1690" r="55" fill="#be185d" />
  <text x="160" y="1705" font-family="'Cairo', sans-serif" font-size="44" text-anchor="middle">🚚</text>
  <text x="250" y="1660" font-family="'Cairo', sans-serif" font-size="38" font-weight="900" fill="#ffffff">توصيل سريع بأسعار طلبات حسب المسافة</text>
  <text x="250" y="1720" font-family="'Cairo', sans-serif" font-size="26" font-weight="600" fill="#fbcfe8">نغطي كافة مجمعات وأحياء ٦ أكتوبر والشيخ زايد مع الدفع عند الاستلام أو فودافون كاش</text>
